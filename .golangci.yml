version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errchkjson
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

run:
  # Allow multiple parallel golangci-lint instances running.
  allow-parallel-runners: true
