version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/viewer/sap-tui"
      - "/viewer/sap-web"
    schedule:
      interval: weekly
    commit-message:
      # fix(deps): so release-please includes bumps in changelogs
      prefix: "fix(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
