experimental_monorepo_root = true

[monorepo]
config_roots = ["viewer/*"]

[settings]
experimental = true

[tools]
buf = "latest"
go = "latest"
"go:golang.org/x/tools/cmd/deadcode" = "latest"
gofumpt = "latest"
golangci-lint = "latest"
gotestsum = "latest"
protoc = "latest"
protoc-gen-go = "latest"

[tasks.proto]
run = "buf generate"

[tasks.format]
run = ["gofumpt -w .", "buf format -w"]

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
run = "gotestsum -- ./..."

[tasks.deadcode]
run = "deadcode ./..."
